<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Mannequin - Galerie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* --- Variables & Thème --- */
        :root {
            --bg-light: #fcfcfc;
            --bg-dark: #0d0d0d;
            --text-dark: #111111;
            --text-light: #ffffff;
            --accent-color: #666666;
            --border-color: #e5e5e5;
            
            --font-title: 'Playfair Display', serif;
            --font-body: 'Montserrat', sans-serif;
            
            --transition-smooth: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* --- Réinitialisation --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: var(--font-body);
            line-height: 1.7;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Navigation (Fond Blanc) --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(252, 252, 252, 0.95);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-family: var(--font-title);
            font-size: 1.1rem;
            letter-spacing: 3px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            padding-bottom: 4px;
            transition: var(--transition-smooth);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 1px;
            background-color: var(--text-dark);
            transition: var(--transition-smooth);
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .nav-links a.active {
            font-weight: 600;
        }

        /* --- Galerie (Fond Noir) --- */
        .gallery-section {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 3rem 1.5rem;
            flex: 1;
        }

        .gallery-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .gallery-header h1 {
            font-family: var(--font-title);
            font-size: 2rem;
            letter-spacing: 4px;
            font-weight: 400;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .gallery-header p {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #a0a0a0;
            text-transform: uppercase;
        }

        /* Grille de 10 Photos (1 colonne sur Mobile) */
        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 2px;
            background-color: #1a1a1a;
            aspect-ratio: 3 / 4; /* Aspect ratio portrait pour mannequinat */
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(15%);
            transition: var(--transition-smooth);
        }

        /* Effet au survol / au toucher */
        .gallery-item:hover img,
        .gallery-item:active img {
            filter: grayscale(0%);
            transform: scale(1.04);
        }

        /* --- Footer (Fond Blanc) --- */
        footer {
            text-align: center;
            padding: 2rem 1.5rem;
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: var(--accent-color);
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-light);
        }

        /* --- Adaptabilité Ordinateurs & Tablettes --- */
        @media (min-width: 768px) {
            .navbar {
                padding: 2rem 5rem;
            }

            .logo {
                font-size: 1.3rem;
            }

            .nav-links {
                gap: 3rem;
            }

            .nav-links a {
                font-size: 0.8rem;
            }

            .gallery-section {
                padding: 5rem 3rem;
            }

            .gallery-header h1 {
                font-size: 3rem;
            }

            /* 2 ou 3 colonnes sur grands écrans */
            .gallery-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 2rem;
            }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">MATSANGUE MA MBADINGUE HELENA</div>
        <nav>
            <ul class="nav-links">
                <li><a href="./présentation.html">Présentation</a></li>
                <li><a href="./galerie.html" class="active">Galerie</a></li>
                <li><a href="./à propos.html">À Propos</a></li>
            </ul>
        </nav>
    </header>

    <main class="gallery-section">
        <div class="gallery-header">
            <h1>BOOK PHOTO</h1>
            <p>Sélection Éditoriale & Défilés</p>
        </div>

        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="./1.jpg" alt="Photo Galerie 1">
            </div>
            <div class="gallery-item">
                <img src="./2.jpg" alt="Photo Galerie 2">
            </div>
            <div class="gallery-item">
                <img src="./3.jpg" alt="Photo Galerie 3">
            </div>
            <div class="gallery-item">
                <img src="./4.jpg" alt="Photo Galerie 4">
            </div>
            <div class="gallery-item">
                <img src="./5.jpg" alt="Photo Galerie 5">
            </div>
            <div class="gallery-item">
                <img src="./7.jpg" alt="Photo Galerie 6">
            </div>
            <div class="gallery-item">
                <img src="./13.jpg" alt="Photo Galerie 7">
            </div>
            <div class="gallery-item">
                <img src="./10.jpg" alt="Photo Galerie 8">
            </div>
            <div class="gallery-item">
                <img src="./11.jpg" alt="Photo Galerie 9">
            </div>
            <div class="gallery-item">
                <img src="./12.jpg" alt="Photo Galerie 10">
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; MATSANGUE MA MBADINGUE HELENA. Tous droits réservés.</p>
    </footer>

</body>
</html>
